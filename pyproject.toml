[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiexi"
version = "0.1.0"
description = "Break down Chinese sentences word by word using a local LLM"
requires-python = ">=3.10"
dependencies = ["ollama", "rich"]

[project.scripts]
jiexi = "jiexi.cli:main"